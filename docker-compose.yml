version: '3.8'

services:
  db-mysql:
    image: mysql:8.0
    container_name: nfm-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=netdisk_db
      - MYSQL_TCP_PORT=3306
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql